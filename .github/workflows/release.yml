name: Release

# Fires on the tag, not on a branch push. The tag is what names a release, so
# making it the trigger means there is exactly one way to cut one and no way to
# publish something that was never tagged.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Read the version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Rebuilt here rather than uploaded from a laptop, so the published jar is
      # provably the tagged tree and not whatever happened to be in target/.
      - name: Build
        run: mvn -B -ntp clean package -DskipTests

      - name: Confirm the jar matches the tag
        run: |
          JAR="target/oss-cli-${{ steps.v.outputs.version }}.jar"
          test -f "$JAR" || {
            echo "::error::$JAR not found. The pom version and the tag disagree."
            ls -1 target/*.jar || true
            exit 1
          }
          echo "jar=$JAR" >> "$GITHUB_ENV"
          echo "sha=$(sha256sum "$JAR" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Extract this version's changelog entry
        run: |
          # The section between this version's heading and the next one. Falls
          # back to generated notes when the entry is missing, so a release is
          # never blocked by a forgotten changelog edit.
          awk -v v="## ${{ steps.v.outputs.version }}" '
            $0 ~ "^"v { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md || true

          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG entry for ${{ steps.v.outputs.version }} — using generated notes."
            rm -f release-notes.md
          fi

      # Idempotent, so the run can be repeated. The usual reason to repeat one is
      # that a secret was missing the first time -- adding it and re-running is
      # the obvious fix, and it would otherwise fail here on a release that
      # already exists, before reaching the step that was the point.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — replacing the jar."
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          elif [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "$jar" \
              --title "OSS-CLI $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$jar" \
              --title "OSS-CLI $GITHUB_REF_NAME" --generate-notes
          fi

      # Runs only when the tap token is present, so a fork or a contributor's
      # tag does not fail the whole release on a secret they cannot have.
      #
      # The condition reads env, not secrets. The secrets context is not
      # available to a step-level `if`, and a workflow referencing it there is
      # rejected before any job starts -- the whole file fails to parse, which
      # reports as a failed run with no logs and no obvious cause.
      - name: Update the Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-oss-cli.git" tap
          cd tap

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/oss-cli-${VERSION}.jar"
          sed -i -e "s|url \".*\"|url \"${URL}\"|" -e "s|sha256 \".*\"|sha256 \"${sha}\"|" oss-cli.rb

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oss-cli.rb
          git diff --cached --quiet || git commit -m "Bump Homebrew formula to v${VERSION}"
          git push

      - name: Summary
        run: |
          {
            echo "### OSS-CLI $GITHUB_REF_NAME published"
            echo
            echo "- jar: \`$(basename "$jar")\`"
            echo "- sha256: \`$sha\`"
            echo "- [release page](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"
