name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a pull request makes the first run irrelevant. Cancelling it
# frees a runner and stops a stale red cross sitting on a branch that was
# already fixed. main is never cancelled: its history is what release.sh trusts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The tests run where this ships. Until now they ran on ubuntu/17 only, while the
    # release archives were built for macOS, Linux and Windows -- with -DskipTests --
    # and only after the tag was pushed. A Windows-only fault was therefore first
    # discoverable by whoever ran brew upgrade, which is exactly how "A colon in a
    # filename cost the Windows build, and the tag was already pushed" happened.
    #
    # JDK 21 is not decoration either: the distribution images are jlinked from 21 and
    # run this jar on a 21 runtime, so 21 is what most users actually execute. Nothing
    # had ever run the suite there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "17"
            primary: true
          - os: ubuntu-latest
            java: "21"
          - os: macos-14
            java: "17"
          - os: windows-latest
            java: "17"

    name: ${{ matrix.os }} · JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    # A job that cannot finish should fail rather than hold the queue: the whole build
    # is under two minutes on every platform measured.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # spotless:check is bound to the verify phase, so formatting is a build
      # failure here rather than a review comment.
      - name: Build and verify
        shell: bash
        run: mvn -B -ntp clean verify

      # `verify` runs the unit tests above. This covers what they cannot: picocli
      # wires subcommands by annotation at runtime, so a duplicated command name
      # or a bad @Option type compiles cleanly, passes every test, and fails on
      # first launch -- which without this would be discovered by whoever ran
      # brew upgrade.
      - name: Smoke test the built jar
        shell: bash
        run: |
          JAR=$(ls target/oss-cli-*.jar | head -1)
          echo "Testing $JAR"

          java -jar "$JAR" --help > help.txt
          java -jar "$JAR" --version

          # Four spaces, not two. `oss --help` groups its commands: the group heading sits
          # at two and the commands under it at four. Anchored at two, every one of these
          # looked missing and the smoke test failed on a help screen that was correct --
          # which is the same mistake tools/check-site.sh made, from the same change.
          for cmd in sync review search ask triage hub pr doctor ext serve; do
            grep -q "^    $cmd" help.txt || {
              echo "::error::'$cmd' is missing from --help; the subcommand is not wired up"
              cat help.txt
              exit 1
            }
          done

          # And the twenty-three hidden ones must still be there. Hiding is a presentation
          # decision; this is what keeps it from quietly becoming a removal, which is the
          # failure this whole smoke test exists to catch one release earlier than a user does.
          java -jar "$JAR" --help-all > all.txt
          for cmd in profile onboard prompt backup restore history followup backlog critical chat guide; do
            grep -q "^  $cmd" all.txt || {
              echo "::error::'$cmd' is gone, not hidden — --help-all does not list it"
              cat all.txt
              exit 1
            }
          done

          # Each must at least parse its own options rather than crash on load.
          for cmd in sync profile onboard review prompt doctor; do
            java -jar "$JAR" "$cmd" --help > /dev/null || {
              echo "::error::'$cmd --help' failed; the command cannot initialise"
              exit 1
            }
          done

          # Exit codes, on every platform.
          #
          # These are the half of the interface a script reads, and nothing
          # checked them. They were verified by hand twice today and got the
          # WRONG answer both times, because `oss ... | head; echo $?` reports
          # head's status, not oss's -- so a passing command read as failing and
          # a failing one read as passing. A person cannot reliably measure this
          # at a terminal; a runner can.
          #
          # Windows is the reason this runs on the matrix rather than once. An
          # earlier release shipped a command that exited 0 on failure there and
          # non-zero everywhere else, and nobody noticed until a pipeline did.
          code() { "$@" >/dev/null 2>&1; echo $?; }

          for cmd in "--version" "--help" "doctor" "skill" "ext list" "memory"; do
            # shellcheck disable=SC2086
            got=$(code java -jar "$JAR" $cmd)
            [ "$got" = "0" ] || {
              echo "::error::'oss $cmd' succeeded but exited $got; a script would treat that as failure"
              exit 1
            }
          done

          # A command that did not do what was asked must say so in the status,
          # whether it refused, could not parse, or was never a command.
          for cmd in "nosuchcommand" "ask --nosuchflag x" "review" "pr" "triage" "skill show nosuchskill"; do
            # shellcheck disable=SC2086
            got=$(code java -jar "$JAR" $cmd)
            [ "$got" != "0" ] || {
              echo "::error::'oss $cmd' failed but exited 0; a script would treat that as success"
              exit 1
            }
          done

          echo "All commands reachable, loadable, and honest about their status."

      # The landing page is the first thing anybody reads about oss, and ubuos.com
      # serves this exact file. It kept building perfectly while claiming 43
      # commands when there were 41, teaching `oss chat` after it stopped being
      # printed, and telling readers they needed Java 17 when every download has
      # carried its own runtime since 1.0. None of that breaks a build, which is
      # why it needs one.
      #
      # Primary leg only: it reads the jar this job just built, and the answer is
      # the same on all four.
      - name: The landing page must describe this build
        if: success() && matrix.primary
        shell: bash
        run: tools/check-site.sh --local

      - name: Keep the jar for inspection
        # From the primary job only. Four jobs uploading the same artifact name is an
        # error, and the jar is identical anyway -- the pom compiles to release 17
        # whichever JDK builds it.
        if: success() && matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: oss-cli-jar
          path: target/oss-cli-*.jar
          retention-days: 7
          if-no-files-found: error

  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The page is deployed as-is with no build step, so a malformed tag ships
      # straight to production. Checking the markup here is the only gate.
      - name: Check the site is well-formed and self-contained
        run: |
          python3 - <<'PY'
          import sys, re
          from html.parser import HTMLParser

          VOID = {'area','base','br','col','embed','hr','img','input','link',
                  'meta','param','source','track','wbr'}

          # Elements that FETCH. An <a href> is a link the reader follows, not a
          # resource the page loads, so it is not a policy violation and must
          # not be flagged -- the page links to GitHub on purpose.
          LOADING = {'link':'href', 'script':'src', 'img':'src', 'iframe':'src',
                     'source':'src', 'video':'src', 'audio':'src', 'embed':'src',
                     'object':'data', 'track':'src', 'input':'src'}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack, self.errs, self.external = [], [], []
              def handle_starttag(self, t, attrs):
                  wanted = LOADING.get(t)
                  if wanted:
                      for k, v in attrs:
                          if k == wanted and v and v.startswith(('http://', 'https://', '//')):
                              self.external.append((t, v, self.getpos()))
                  if t not in VOID:
                      self.stack.append((t, self.getpos()))
              def handle_startendtag(self, t, attrs):
                  self.handle_starttag(t, attrs)
                  if t not in VOID and self.stack:
                      self.stack.pop()
              def handle_endtag(self, t):
                  if not self.stack:
                      self.errs.append(f'stray </{t}> at {self.getpos()}')
                      return
                  top = self.stack.pop()
                  if top[0] != t:
                      self.errs.append(f'</{t}> at {self.getpos()} closes <{top[0]}> from {top[1]}')

          src = open('site/index.html', encoding='utf-8').read()
          p = P(); p.feed(src)

          fail = False
          for e in p.errs:
              print(f'::error file=site/index.html::{e}'); fail = True
          if p.stack:
              print(f'::error file=site/index.html::unclosed: {[t for t,_ in p.stack]}'); fail = True

          # _headers forbids external fetches, so anything that slips in here
          # works locally and is blocked in production -- the worst failure to
          # debug, and invisible without this check.
          for tag, url, pos in p.external:
              print(f'::error file=site/index.html,line={pos[0]}::<{tag}> loads "{url}" '
                    f'from another host, which the Content-Security-Policy in site/_headers blocks')
              fail = True

          # A version pinned in an install command 404s on the next release.
          for m in re.finditer(r'oss-cli-\d+\.\d+\.\d+\.jar', src):
              print(f'::error file=site/index.html::hardcoded jar version "{m.group(0)}" '
                    f'will 404 after the next release; resolve it from the API instead'); fail = True

          print('site OK' if not fail else 'site FAILED')
          sys.exit(1 if fail else 0)
          PY

  # The page is no longer published from here. It is folded into ubuos.com/osscli
  # by ubuos-site's Deploy workflow, which checks this repository out and copies
  # site/index.html into its own build -- one project, one domain, the same move
  # the manual made when docs.ubuos.com was retired.
  #
  # The markup gate above still runs on every change, because it is this
  # repository's page and a malformed tag should fail here rather than in the
  # repository that merely serves it.
  #
  # Nothing is deleted: the osscli Pages project still exists and still holds the
  # last deployment made from here. Retiring it is a separate, deliberate act.
